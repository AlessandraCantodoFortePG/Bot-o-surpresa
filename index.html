<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Uma surpresa para você</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #ffe0ec, #e7ddff);
    }

    .card {
      width: min(100%, 420px);
      padding: 42px 28px;
      text-align: center;
      background: rgba(255, 255, 255, 0.92);
      border-radius: 24px;
      box-shadow: 0 18px 45px rgba(77, 47, 100, 0.2);
    }

    .emoji {
      font-size: 58px;
      margin-bottom: 12px;
    }

    h1 {
      margin: 0 0 12px;
      color: #3d244f;
      font-size: 28px;
    }

    p {
      margin: 0 0 28px;
      color: #654f70;
      font-size: 18px;
      line-height: 1.5;
    }

    button {
      border: 0;
      padding: 16px 28px;
      border-radius: 999px;
      color: white;
      background: #8b4fc7;
      font-size: 17px;
      font-weight: bold;
      cursor: pointer;
      box-shadow: 0 8px 18px rgba(139, 79, 199, 0.3);
      transition: transform 0.2s, background 0.2s;
    }

    button:hover {
      background: #713aa9;
      transform: translateY(-2px);
    }

    button:active {
      transform: scale(0.97);
    }

    button:disabled {
      opacity: 0.7;
      cursor: wait;
    }
  </style>
</head>

<body>

  <section class="card">
    <div class="emoji">🎁</div>

    <h1>Olha o que tenho para você!</h1>

    <p>
      Preparei uma surpresa especial.<br>
      É só clicar no botão abaixo.
    </p>

    <button id="surpriseButton">
      ✨ Ver minha surpresa
    </button>
  </section>

  <script>
    const imageUrl =
      "https://files.manuscdn.com/user_upload_by_module/session_file/310519663183305740/YJTJvIARQOXVyhwR.jpg";

    const button = document.getElementById("surpriseButton");

    button.addEventListener("click", async () => {
      const originalText = button.textContent;

      button.disabled = true;
      button.textContent = "Baixando...";

      try {
        const response = await fetch(imageUrl, {
          mode: "cors"
        });

        if (!response.ok) {
          throw new Error("Não foi possível baixar a imagem.");
        }

        const blob = await response.blob();
        const temporaryUrl = URL.createObjectURL(blob);

        const link = document.createElement("a");
        link.href = temporaryUrl;
        link.download = "surpresa.jpg";

        document.body.appendChild(link);
        link.click();
        link.remove();

        URL.revokeObjectURL(temporaryUrl);

      } catch (error) {
        // Alternativa caso o servidor bloqueie o download automático
        const link = document.createElement("a");

        link.href = imageUrl;
        link.download = "surpresa.jpg";
        link.target = "_blank";
        link.rel = "noopener";

        link.click();
      }

      button.disabled = false;
      button.textContent = originalText;
    });
  </script>

</body>
</html>
